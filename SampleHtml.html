<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Patient Record System</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
        }

        header {
            max-width: 1100px;
            margin: 0 auto 20px auto;
            background: #005b96;
            color: #fff;
            padding: 15px 20px;
            border-radius: 6px;
        }

            header h1 {
                margin: 0;
                font-size: 1.5rem;
            }

        .card {
            background: #fff;
            padding: 20px;
            border-radius: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.08);
        }

        h2 {
            margin-top: 0;
            font-size: 1.2rem;
            color: #005b96;
            border-bottom: 2px solid #eef2f5;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        input, select, textarea {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        button {
            background: #005b96;
            color: #fff;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
        }

            button:hover {
                background: #003f6b;
            }

        .alert {
            display: none;
            background: #d4edda;
            color: #155724;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
            font-size: 0.9rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        th, td {
            text-align: left;
            padding: 10px;
            border-bottom: 1px solid #e0e0e0;
        }

        th {
            background-color: #f8fafb;
            color: #005b96;
        }

        tr:hover {
            background-color: #f9f9f9;
        }

        .badge {
            background: #e3f2fd;
            color: #0d47a1;
            padding: 3px 7px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.8rem;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>City General Hospital - Patient Records</h1>
    </header>

    <div class="container">
        <!-- Patient Intake Form -->
        <div class="card">
            <h2>New Patient Intake</h2>
            <div id="alertBox" class="alert">Patient record added successfully.</div>

            <form id="patientForm">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" required placeholder="e.g., Robert Brown">
                </div>

                <div class="form-group">
                    <label for="dob">Date of Birth</label>
                    <input type="date" id="dob" required>
                </div>

                <div class="form-group">
                    <label for="gender">Gender</label>
                    <select id="gender" required>
                        <option value="">Select Gender</option>
                        <option value="Female">Female</option>
                        <option value="Male">Male</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="blood_type">Blood Type</label>
                    <select id="blood_type" required>
                        <option value="">Select Blood Type</option>
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="phone">Contact Number</label>
                    <input type="text" id="phone" required placeholder="e.g., 555-0199">
                </div>

                <div class="form-group">
                    <label for="diagnosis">Primary Diagnosis / Notes</label>
                    <textarea id="diagnosis" rows="3" required placeholder="Enter initial symptoms or diagnosis..."></textarea>
                </div>

                <button type="submit">Save Patient Record</button>
            </form>
        </div>

        <!-- Patient Directory Table -->
        <div class="card">
            <h2>Active Patient Directory</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>DOB</th>
                        <th>Gender</th>
                        <th>Blood</th>
                        <th>Phone</th>
                        <th>Diagnosis</th>
                    </tr>
                </thead>
                <tbody id="patientTableBody">
                    <tr>
                        <td><strong>PT-1001</strong></td>
                        <td>Jane Doe</td>
                        <td>1988-05-14</td>
                        <td>Female</td>
                        <td><span class="badge">O+</span></td>
                        <td>555-0192</td>
                        <td>Seasonal Allergies</td>
                    </tr>
                    <tr>
                        <td><strong>PT-1002</strong></td>
                        <td>John Smith</td>
                        <td>1975-11-22</td>
                        <td>Male</td>
                        <td><span class="badge">A-</span></td>
                        <td>555-0148</td>
                        <td>Hypertension</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
    // Handle form submission using browser JavaScript instead of PHP
    document.getElementById('patientForm').addEventListener('submit', function(event) {
        event.preventDefault(); // Prevent page from refreshing

        // Generate a random Patient ID
        const id = 'PT-' + Math.floor(1003 + Math.random() * 8997);

        // Get form values
        const name = document.getElementById('name').value;
        const dob = document.getElementById('dob').value;
        const gender = document.getElementById('gender').value;
        const blood = document.getElementById('blood_type').value;
        const phone = document.getElementById('phone').value;
        const diagnosis = document.getElementById('diagnosis').value;

        // Create a new row in the table
        const tbody = document.getElementById('patientTableBody');
        const newRow = document.createElement('tr');

        // Safely insert text into cells
        const cells = [id, name, dob, gender, blood, phone, diagnosis];
        cells.forEach((value, index) => {
            const td = document.createElement('td');
            if (index === 0) {
                const strong = document.createElement('strong');
                strong.textContent = value;
                td.appendChild(strong);
            } else if (index === 4) {
                const span = document.createElement('span');
                span.className = 'badge';
                span.textContent = value;
                td.appendChild(span);
            } else {
                td.textContent = value;
            }
            newRow.appendChild(td);
        });

        tbody.appendChild(newRow);

        // Show success alert and clear the form
        const alertBox = document.getElementById('alertBox');
        alertBox.style.display = 'block';
        this.reset();

        setTimeout(() => {
            alertBox.style.display = 'none';
        }, 3000);
    });
    </script>

</body>
</html>
